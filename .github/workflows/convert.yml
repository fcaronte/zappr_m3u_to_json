name: Converti M3U in JSON Zappr

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL della playlist M3U (es. https://raw.githubusercontent.com/USER/REPO/main/file.m3u)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Estrai info dall'URL e converti
        env:
          M3U_URL: ${{ inputs.m3u_url }}
        run: |
          # Estrai il nome del repo come nome lista
          LIST_NAME=$(echo "$M3U_URL" | sed -n 's|.*github\.com/[^/]*/\([^/]*\)/.*|\1|p')
          if [ -z "$LIST_NAME" ]; then
            LIST_NAME="Lista IPTV"
          fi
          
          # Estrai lo username GitHub come publisher
          PUBLISHER=$(echo "$M3U_URL" | sed -n 's|.*github\.com/\([^/]*\)/.*|\1|p')
          if [ -z "$PUBLISHER" ]; then
            PUBLISHER="Sconosciuto"
          fi
          
          echo "::notice::Nome lista: $LIST_NAME"
          echo "::notice::Publisher: $PUBLISHER"
          
          # Crea cartella output
          mkdir -p output
          
          # Esegui la conversione
          python convert.py "$M3U_URL" \
            --name "$LIST_NAME" \
            --publisher "$PUBLISHER" \
            --publisher-link "" \
            --epg "" \
            -o "output/channels.json"

      - uses: actions/upload-artifact@v4
        with:
          name: zappr-channels-json
          path: output/channels.json
          retention-days: 5
