name: Converti M3U in JSON Zappr

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL della playlist M3U"
        required: true
        type: string
      list_name:
        description: "Nome della lista"
        required: true
        default: "La mia lista"
        type: string
      output_file:
        description: "Nome del file JSON in output"
        required: true
        default: "channels.json"
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Converti
        env:
          M3U_URL: ${{ inputs.m3u_url }}
          LIST_NAME: ${{ inputs.list_name }}
          OUTPUT_FILE: ${{ inputs.output_file }}
        run: |
          case "$OUTPUT_FILE" in
            */*|..*|"") echo "::error::Nome file non valido"; exit 1 ;;
          esac
          mkdir -p output
          python convert.py "$M3U_URL" \
            -o "output/$OUTPUT_FILE" \
            --name "$LIST_NAME" \
            --publisher "Sconosciuto" \
            --publisher-link "" \
            --epg ""

      - name: Valida con schema.json (se presente)
        env:
          OUTPUT_FILE: ${{ inputs.output_file }}
        run: |
          if [ -f schema.json ]; then
            pip install jsonschema
            python validate.py schema.json "output/$OUTPUT_FILE"
          else
            echo "schema.json non trovato: validazione saltata"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zappr-json
          path: output/

      - name: Salva il JSON nel repository
        env:
          OUTPUT_FILE: ${{ inputs.output_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/$OUTPUT_FILE"
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Aggiorna output/$OUTPUT_FILE"
          git push
