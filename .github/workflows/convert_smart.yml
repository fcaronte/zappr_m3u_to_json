name: Converti M3U in JSON (Smart & Auto)

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL Playlist (lascia vuoto per usare quello salvato)"
        required: false
        type: string
      list_name:
        description: "Nome Lista"
        required: true
        default: "La mia lista"
        type: string
      output_filename:
        description: "Nome File Output"
        required: true
        default: "channels.json"
        type: string
  
  schedule:
    # Aggiornamento automatico ogni giorno alle 03:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  convert-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determina URL Sorgente
        id: set_url
        run: |
          # 1. Prova a prendere l'input manuale
          URL="${{ inputs.m3u_url }}"
          
          # 2. Se vuoto, prova la variabile salvata (per il cron o comodità)
          if [ -z "$URL" ]; then
            URL="${{ vars.DEFAULT_M3U_URL }}"
          fi
          
          # 3. Se ancora vuoto, errore
          if [ -z "$URL" ]; then
            echo "::error::Nessun URL trovato. Inseriscilo manualmente o imposta la variabile DEFAULT_M3U_URL nelle Settings."
            exit 1
          fi
          
          echo "final_url=$URL" >> $GITHUB_OUTPUT
          echo "::notice::URL selezionato: $URL"

      - name: Converti Playlist
        env:
          M3U_URL: ${{ steps.set_url.outputs.final_url }}
          LIST_NAME: ${{ inputs.list_name || 'Lista Auto-Update' }}
          OUTPUT_FILENAME: ${{ inputs.output_filename || 'channels.json' }}
        run: |
          PUBLISHER=$(echo "$M3U_URL" | sed -n 's|.*github\.com/\([^/]*\)/.*|\1|p')
          if [ -z "$PUBLISHER" ]; then PUBLISHER="Sconosciuto"; fi
          
          mkdir -p output
          python convert.py "$M3U_URL" \
            -o "output/$OUTPUT_FILENAME" \
            --name "$LIST_NAME" \
            --publisher "$PUBLISHER" \
            --publisher-link "" \
            --epg ""

      - name: Salva su GitHub (Commit)
        env:
          OUTPUT_FILENAME: ${{ inputs.output_filename || 'channels.json' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/$OUTPUT_FILENAME"
          
          # Se il file non è cambiato, non fare nulla
          git diff --cached --quiet && echo "Nessuna modifica rilevata, skip commit." && exit 0
          
          git commit -m "Auto-update: Sync channels.json"
          git push
